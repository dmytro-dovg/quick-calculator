[mod-name]
quick-calculator=Quick Calculator

[mod-description]
quick-calculator=A calculator pop-up to quickly perform simple calculations.

[shortcut-name]
quick-calculator=Calculator

[command-help]
qcalc=Usage: /__1__ [EXPRESSION]\n\nEvaluate EXPRESSION and print the result. With no EXPRESSION, toggle the calculator window.\n\nArguments:\n    EXPRESSION a mathematical expression, e.g. 3 + 12/4\n\nSupported:\n    operators: + - * / % ^ ** !\n    grouping: ( ) | |\n    functions: sqrt abs exp ln log log2 sin cos tan asin acos atan floor ceil round trunc sign rad deg\n    constants: pi e\n\nTrigonometric functions use radians.

[gui-quick-calculator]
result_label==
clear-tooltip=Clear
info-tooltip-header=[font=default-bold]Supported operations[/font]
info-tooltip-category=__1__: __2__
info-category-basic=Add, subtract, multiply, divide
info-category-modulo=Modulo
info-category-exponent=Exponent
info-category-factorial=Factorial
info-category-grouping=Grouping
info-category-functions=Functions
info-category-constants=Constants
instructions=Press __CONTROL_STYLE_BEGIN__Escape__CONTROL_STYLE_END__ or __CONTROL_STYLE_BEGIN__Enter__CONTROL_STYLE_END__ to close

[quick-calculator-error]
parse-error=Parse error at __1__: __2__
unexpected=Unexpected error: __1__
expected-number=expected a number
invalid-number=invalid number literal '__1__'
factorial-negative=factorial of a negative number (__1__)
factorial-non-integer=factorial requires an integer, got __1__
factorial-too-large=factorial of __1__ is too large (maximum is __2__)
expected-closing-bar=expected '|'
expected-closing-paren=expected ')'
expected-opening-paren=expected '(' after '__1__'
unexpected-end=unexpected end of input
unknown-function=unknown function '__1__'
unknown-identifier=unknown identifier '__1__'
division-by-zero=division by zero
modulo-by-zero=modulo by zero
unexpected-trailing-input=unexpected trailing input '__1__'
