[mod-name]
quick-calculator=Quick Calculator

[mod-description]
quick-calculator=Спливаюче вікно з калькулятором для швидких обчислень.

[shortcut-name]
quick-calculator=Калькулятор

[command-help]
qcalc=Використання: /__1__ [ВИРАЗ]\n\nОбчислити ВИРАЗ і вивести результат. Без ВИРАЗУ — відкрити вікно калькулятора.\n\nАргументи:\n    ВИРАЗ математичний вираз, напр. 3 + 12/4\n\nПідтримується:\n    оператори: + - * / % ^ ** !\n    групування: ( ) | |\n    функції: sqrt abs exp ln log log2 sin cos tan asin acos atan floor ceil round trunc sign rad deg\n    константи: pi e\n\nТригонометричні функції використовують радіани.

