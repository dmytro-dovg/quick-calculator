[mod-name]
quick-calculator=Quick Calculator

[mod-description]
quick-calculator=Спливаюче вікно з калькулятором для швидких обчислень.

[shortcut-name]
quick-calculator=Калькулятор

[command-help]
qcalc=Використання: /__1__ [ВИРАЗ]\n\nОбчислити ВИРАЗ і вивести результат. Без ВИРАЗУ — відкрити вікно калькулятора.\n\nАргументи:\n    ВИРАЗ математичний вираз, напр. 3 + 12/4\n\nПідтримується:\n    оператори: + - * / % ^ ** !\n    групування: ( ) | |\n    функції: sqrt abs exp ln log log2 sin cos tan asin acos atan floor ceil round trunc sign rad deg\n    константи: pi e\n\nТригонометричні функції використовують радіани.

[gui-quick-calculator]
result_label==
clear-tooltip=Очистити
info-tooltip-header=[font=default-bold]Підтримувані операції[/font]
info-tooltip-category=__1__: __2__
info-category-basic=Додавання, віднімання, множення, ділення
info-category-modulo=Остача
info-category-exponent=Степінь
info-category-factorial=Факторіал
info-category-grouping=Групування
info-category-functions=Функції
info-category-constants=Константи
instructions=Натисніть __CONTROL_STYLE_BEGIN__Escape__CONTROL_STYLE_END__ або __CONTROL_STYLE_BEGIN__Enter__CONTROL_STYLE_END__ щоб закрити

[quick-calculator-error]
parse-error=Помилка на позиції __1__: __2__
unexpected=Неочікувана помилка: __1__
expected-number=очікується число
invalid-number=некоректне число '__1__'
factorial-negative=факторіал від'ємного числа (__1__)
factorial-non-integer=факторіал потребує цілого числа, отримано __1__
factorial-too-large=факторіал __1__ занадто великий (максимум __2__)
expected-closing-bar=очікується '|'
expected-closing-paren=очікується ')'
expected-opening-paren=очікується '(' після '__1__'
unexpected-end=несподіваний кінець виразу
unknown-function=невідома функція '__1__'
unknown-identifier=невідомий ідентифікатор '__1__'
division-by-zero=ділення на нуль
modulo-by-zero=остача від ділення на нуль
unexpected-trailing-input=зайві символи в кінці виразу '__1__'
